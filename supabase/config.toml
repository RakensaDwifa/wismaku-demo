# WismaKu local Supabase stack
# Jalankan: supabase start
# Studio:   http://localhost:54323
# API:      http://localhost:54321

[project]
id = "wismaku-demo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.midtrans-token]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.midtrans-webhook]
verify_jwt = false
